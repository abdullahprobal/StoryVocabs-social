name: publish

on:
  schedule:
    - cron: "0 2 * * *"      # 08:00 BST morning slot
    - cron: "0 14 * * *"     # 20:00 BST evening slot
    - cron: "0 8 * * *"      # 14:00 BST — due first-comments (quiz answers)
  workflow_dispatch:
    inputs:
      date:
        required: false
      slot:
        description: "morning | evening (default by current BST hour)"
        required: false
      comments_only:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

concurrency:
  group: social-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Dhaka"
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MEDIA_HOST: ${{ vars.MEDIA_HOST || 'github' }}
      MEDIA_REPO: ${{ vars.MEDIA_REPO }}
      MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://storyvocabs.bandb.academy' }}
      REVIEW_MODE: ${{ vars.REVIEW_MODE || 'review' }}
      PUBLISH_TO_INSTAGRAM: ${{ vars.PUBLISH_TO_INSTAGRAM || 'true' }}
      PUBLISH_STORIES: ${{ vars.PUBLISH_STORIES || 'true' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      IN_DATE: ${{ inputs.date }}
      IN_SLOT: ${{ inputs.slot }}
      IN_COMMENTS: ${{ inputs.comments_only }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null
      - name: Publish
        run: |
          HOUR=$(TZ=Asia/Dhaka date +%H)
          if [ "$IN_COMMENTS" = "true" ] || { [ "$EVENT_NAME" = "schedule" ] && [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 18 ]; }; then
            python -m engine.publish --comments
          else
            ARGS=""
            [ -n "$IN_DATE" ] && ARGS="$ARGS --date $IN_DATE"
            [ -n "$IN_SLOT" ] && ARGS="$ARGS --slot $IN_SLOT"
            python -m engine.publish $ARGS
          fi
      - name: Commit state
        if: always() && env.DRY_RUN != 'true'
        run: |
          git config user.name "storyvocabs-bot"
          git config user.email "bot@storyvocabs.local"
          git add queue state analytics evergreen
          git diff --cached --quiet || git commit -m "chore(publish): $(date -u +%FT%H:%M) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
