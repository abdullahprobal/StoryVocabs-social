name: publish

on:
  schedule:
    # Hourly heartbeat 08:23–22:23 BST. GitHub runs schedules hours late, so each run publishes
    # whatever is due today (engine/due.py) instead of guessing the slot from the clock.
    # Off the hour on purpose: top-of-hour schedules are the ones GitHub delays most.
    - cron: "23 2-16 * * *"
  workflow_dispatch:
    inputs:
      date:
        required: false
      slot:
        description: "morning | evening (default by current BST hour)"
        required: false
      comments_only:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

concurrency:
  group: social-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Dhaka"
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MEDIA_HOST: ${{ vars.MEDIA_HOST || 'github' }}
      MEDIA_REPO: ${{ vars.MEDIA_REPO }}
      MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
      MEDIA_DEPLOY_KEY: ${{ secrets.MEDIA_DEPLOY_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://storyvocabs.com' }}
      REVIEW_MODE: ${{ vars.REVIEW_MODE || 'review' }}
      PUBLISH_TO_INSTAGRAM: ${{ vars.PUBLISH_TO_INSTAGRAM || 'true' }}
      PUBLISH_STORIES: ${{ vars.PUBLISH_STORIES || 'true' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      IN_DATE: ${{ inputs.date }}
      IN_SLOT: ${{ inputs.slot }}
      IN_COMMENTS: ${{ inputs.comments_only }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Anything due?
        id: due
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          DUE=$(python -m engine.due)
          echo "$DUE"
          echo "run=$([ -n "$DUE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Install
        if: steps.due.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null
      - name: Publish
        if: steps.due.outputs.run == 'true'
        run: |
          if [ "$IN_COMMENTS" = "true" ]; then
            python -m engine.publish --comments
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python -m engine.publish --due
          else
            ARGS=""
            [ -n "$IN_DATE" ] && ARGS="$ARGS --date $IN_DATE"
            [ -n "$IN_SLOT" ] && ARGS="$ARGS --slot $IN_SLOT"
            python -m engine.publish $ARGS
          fi
      - name: Commit state
        if: always() && env.DRY_RUN != 'true' && steps.due.outputs.run == 'true'
        run: |
          git config user.name "storyvocabs-bot"
          git config user.email "bot@storyvocabs.local"
          git add queue state analytics evergreen
          git diff --cached --quiet || git commit -m "chore(publish): $(date -u +%FT%H:%M) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
