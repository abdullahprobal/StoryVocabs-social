name: generate

on:
  schedule:
    - cron: "17 14 * * *"     # 20:17 BST nightly — fill today..+2 days, top up backups, one Telegram lineup (off the hour: GitHub delays :00 most)
    - cron: "17 4 * * *"      # 10:17 BST repair — remake any of today's/tomorrow's posts that failed or were never made
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (empty = fill every missing slot from now through 2 days ahead)"
        required: false
      days:
        description: "days to fill (default 1 = tomorrow)"
        required: false
        default: "1"
      pillar:
        description: "force a pillar (news_word/quiz/confusables/in_app/story60/offer)"
        required: false
      dry_run:
        description: "no upload / no Telegram / no trackers"
        type: boolean
        default: false
      force:
        description: "regenerate existing queue items"
        type: boolean
        default: false
      evergreen:
        description: "refill the backup pool with N posts instead (e.g. 8); used when a slot's post fails"
        required: false

# Own group: a queued review/publish run must never cancel tonight's generation (GitHub keeps only one
# pending run per group). Commits are reconciled by the rebase-and-retry push below.
concurrency:
  group: social-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      TZ: "Asia/Dhaka"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MEDIA_HOST: ${{ vars.MEDIA_HOST || 'github' }}
      MEDIA_REPO: ${{ vars.MEDIA_REPO }}
      MEDIA_REPO_TOKEN: ${{ secrets.MEDIA_REPO_TOKEN }}
      MEDIA_DEPLOY_KEY: ${{ secrets.MEDIA_DEPLOY_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://storyvocabs.com' }}
      REVIEW_MODE: ${{ vars.REVIEW_MODE || 'review' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      IN_DATE: ${{ inputs.date }}
      IN_DAYS: ${{ inputs.days }}
      IN_PILLAR: ${{ inputs.pillar }}
      IN_FORCE: ${{ inputs.force }}
      IN_EVERGREEN: ${{ inputs.evergreen }}
      EVENT_NAME: ${{ github.event_name }}
      REPAIR: ${{ github.event.schedule == '17 4 * * *' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Anything to repair?
        id: gap
        run: |
          if [ "$REPAIR" != "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          GAPS=$(python3 -m engine.due --repair)
          echo "$GAPS"
          echo "run=$([ -n "$GAPS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gap.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.gap.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-color-emoji >/dev/null
      - name: Generate
        if: steps.gap.outputs.run == 'true'
        run: |
          if [ -n "$IN_EVERGREEN" ]; then python -m engine.generate --evergreen "$IN_EVERGREEN"; exit $?; fi
          if [ "$REPAIR" = "true" ]; then python -m engine.generate --repair; exit $?; fi
          # Nightly (and a manual run with no date): fill every missing/failed slot from now through
          # 2 days ahead, top the backup pool up, and send the lineup for the next posting day.
          if [ -z "$IN_DATE" ] && [ -z "$IN_PILLAR" ]; then python -m engine.generate --fill $([ "$IN_FORCE" = "true" ] && echo --force); exit $?; fi
          ARGS=""
          [ -n "$IN_DATE" ] && ARGS="$ARGS --date $IN_DATE"
          [ -n "$IN_DAYS" ] && ARGS="$ARGS --days $IN_DAYS"
          [ -n "$IN_PILLAR" ] && ARGS="$ARGS --pillar $IN_PILLAR"
          [ "$IN_FORCE" = "true" ] && ARGS="$ARGS --force"
          [ -z "$IN_DATE" ] && ARGS="$ARGS --tomorrow"
          python -m engine.generate $ARGS --lineup
      - name: Upload rendered slides (debug)
        if: always() && steps.gap.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_id }}
          path: output/**/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit state
        if: always() && env.DRY_RUN != 'true' && steps.gap.outputs.run == 'true'
        run: |
          git config user.name "storyvocabs-bot"
          git config user.email "bot@storyvocabs.local"
          git add queue state analytics strategy.json evergreen
          git diff --cached --quiet || git commit -m "chore(generate): queue $(date -u +%F) [skip ci]"
          # Another job may have pushed meanwhile: rebase and retry instead of losing tonight's state.
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep $((i * 10)); done
