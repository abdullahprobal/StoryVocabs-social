name: weekly-insights

on:
  schedule:
    - cron: "0 16 * * 0"     # Sunday 22:00 BST
  workflow_dispatch:

concurrency:
  group: social-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m engine.insights
      - name: Commit state
        if: always()
        run: |
          git config user.name "storyvocabs-bot"
          git config user.email "bot@storyvocabs.local"
          git add analytics strategy.json
          git diff --cached --quiet || git commit -m "chore(insights): weekly $(date -u +%F) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
