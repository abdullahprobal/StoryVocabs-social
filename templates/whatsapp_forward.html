<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 800px; height: 800px;
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
    background: #f8fafc;
    background-image:
      radial-gradient(at 0% 0%, rgba(147, 197, 253, 0.5) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(196, 181, 253, 0.4) 0px, transparent 50%);
    display: flex; align-items: center; justify-content: center;
    padding: 40px;
  }
  .card {
    width: 720px; padding: 50px 40px;
    background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6));
    backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 32px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.06);
    text-align: center;
    display: flex; flex-direction: column; gap: 20px;
  }
  .header {
    font-size: 20px; font-weight: 900;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .word-item {
    background: rgba(59,130,246,0.04);
    border: 1px solid rgba(59,130,246,0.1);
    border-radius: 16px;
    padding: 16px 20px;
    text-align: left;
  }
  .word-row {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .word {
    font-size: 24px; font-weight: 900; color: #111827;
  }
  .bangla {
    font-size: 18px; color: #3b82f6; font-weight: 700;
  }
  .footer {
    font-size: 16px; font-weight: 800;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">আজকের {{WORD_COUNT}}টি শব্দ শেখো 📖</div>
  {{WORDS_HTML}}
  <div class="footer">StoryVocabs — খবর পড়ো, শব্দ শেখো, পরীক্ষায় জেতো</div>
</div>
</body>
</html>
