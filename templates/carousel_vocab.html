<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
    background: #f0f4ff;
    background-image:
      radial-gradient(at 0% 0%, rgba(147,197,253,0.5) 0px, transparent 55%),
      radial-gradient(at 100% 100%, rgba(196,181,253,0.4) 0px, transparent 55%);
    overflow: hidden; position: relative;
  }
  .brand-top {
    position: absolute; top: 28px; left: 36px;
    display: flex; align-items: center; gap: 14px; z-index: 20;
    padding: 10px 22px 10px 10px; border-radius: 50px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.8);
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  }
  .logo-img {
    width: 52px; height: 52px; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(59,130,246,0.35);
  }
  .logo-text {
    font-size: 24px; font-weight: 900;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .content {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 112px 44px 92px;
  }
  .header {
    text-align: center; margin-bottom: 20px;
    width: 100%;
  }
  .header h2 {
    font-size: 40px; font-weight: 900; color: #111827;
    line-height: 1.1;
  }
  .header h2 .grad {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .header p {
    font-size: 20px; color: #9ca3af; font-weight: 600; margin-top: 8px;
  }
  .words-list {
    width: 100%; max-width: 972px;
    flex: 1; display: flex; flex-direction: column;
    gap: 14px; justify-content: center;
  }
  .word-card {
    display: flex; align-items: flex-start; gap: 18px;
    padding: 18px 22px; border-radius: 20px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(59,130,246,0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    width: 100%;
  }
  .word-num {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 900; color: white;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(59,130,246,0.3);
    margin-top: 2px;
  }
  .word-info { flex: 1; min-width: 0; width: 100%; }
  .word-top {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .word {
    font-size: 30px; font-weight: 900; color: #0f172a;
  }
  .pos-tag {
    font-size: 12px; font-weight: 700; color: #3b82f6;
    background: rgba(59,130,246,0.09);
    padding: 3px 10px; border-radius: 7px;
    text-transform: uppercase; letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .bangla {
    font-family: 'Noto Sans Bengali', sans-serif;
    font-size: 21px; font-weight: 800; color: #1e40af;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .synonym {
    font-size: 15px; color: #9ca3af; font-weight: 500;
    margin-left: 4px;
  }
  .meaning-text {
    font-size: 17px; color: #4b5563; font-weight: 500;
    line-height: 1.5; margin-top: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .example {
    font-size: 16px; color: #64748b; font-weight: 500;
    font-style: italic; margin-top: 4px; line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .exam-note {
    text-align: center; padding: 14px 24px;
    background: rgba(59,130,246,0.06);
    border: 1px solid rgba(59,130,246,0.12);
    border-radius: 14px;
    font-size: 19px; color: #3b82f6; font-weight: 700;
    margin-top: 14px;
    width: 100%; max-width: 972px;
  }
  .cta-row {
    display: flex; justify-content: center; gap: 12px; margin-top: 12px;
    width: 100%;
  }
  .cta-pill {
    padding: 11px 24px; border-radius: 12px;
    background: rgba(59,130,246,0.07);
    border: 1px solid rgba(59,130,246,0.12);
    font-size: 17px; font-weight: 700; color: #3b82f6;
  }
  .app-cta {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 20px 24px;
    background: linear-gradient(135deg, rgba(37,99,235,0.95), rgba(124,58,237,0.95));
    backdrop-filter: blur(10px); z-index: 20;
    text-align: center;
  }
  .cta-icon { font-size: 18px; display: none; }
  .cta-text {
    font-size: 21px; font-weight: 700; color: rgba(255,255,255,0.95);
    font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
    line-height: 1.3;
  }
  .cta-url { font-size: 22px; font-weight: 900; color: white; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="brand-top">
    <img class="logo-img" src="{{LOGO_SRC}}" alt="SV" />
    <span class="logo-text">StoryVocabs</span>
  </div>

  <div class="content">
    <div class="header">
      <h2>আজকের <span class="grad">শব্দভান্ডার</span></h2>
      <p>{{WORD_COUNT}}টি পরীক্ষায় আসা গুরুত্বপূর্ণ শব্দ</p>
    </div>

    <div class="words-list">
      {{WORDS_HTML}}
    </div>

    <div class="exam-note">{{EXAM_NOTE}}</div>

    <div class="cta-row">
      <span class="cta-pill">💾 Save করো</span>
      <span class="cta-pill">📤 Share করো</span>
      <span class="cta-pill">💬 Comment করো</span>
    </div>
  </div>

  <div class="app-cta">
    <span class="cta-text">📖 গল্পে গল্পে শব্দ শিখতে এখনই ডাউনলোড করো</span>
    <span class="cta-url">storyvocabs.vercel.app</span>
  </div>
</body>
</html>
