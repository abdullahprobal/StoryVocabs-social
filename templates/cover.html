<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- ════════════════════════════════════════════════════════════════
     STORYVOCABS · CAROUSEL TEMPLATE 1 of 4 — COVER
     Canvas: 1080 × 1350 px (4:5 portrait, IG/FB feed-optimal)
     Placeholders (filled by image_renderer.py):
       {{LOGO_SRC}}        base64 data-uri of assets/logo-app-icon.png
       {{SLIDE_NUMBER}}    e.g. 1
       {{TOTAL_SLIDES}}    e.g. 8
       {{CATEGORY_ICON}}   emoji, e.g. 🏏
       {{CATEGORY}}        e.g. Sports
       {{DATE}}            e.g. April 4, 2026
       {{HEADLINE_HTML}}   headline; wrap the hero word in <span class="g">…</span>
       {{HERO_WORD}}       e.g. punitive
       {{HERO_BN}}         short Bangla gloss + POS, e.g. শাস্তিমূলক · adjective
       {{SWIPE_COUNT}}     e.g. 3
     Self-fitting: headline auto-shrinks if long. Sets window.__fitDone=true.
     ════════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f172a; --blue:#3b82f6; --blue-bright:#60a5fa; --purple:#8b5cf6;
    --grad:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);
    --grad-soft:linear-gradient(135deg,#60a5fa 0%,#a78bfa 100%);
    --white:#f8fafc; --slate-400:#94a3b8;
    --surface:rgba(255,255,255,0.05); --hair:rgba(255,255,255,0.10); --hair-bright:rgba(255,255,255,0.16);
    --en:'Inter','Noto Sans Bengali',sans-serif; --bn:'Noto Sans Bengali','Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--white);font-family:var(--en);
    background:var(--ink);
    background-image:
      radial-gradient(at 12% 6%, rgba(59,130,246,0.20) 0px, transparent 40%),
      radial-gradient(at 90% 97%, rgba(139,92,246,0.22) 0px, transparent 44%),
      radial-gradient(at 80% 10%, rgba(96,165,250,0.08) 0px, transparent 38%);
  }
  body::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 50% 38%, #000 0%, transparent 80%);
    mask-image:radial-gradient(circle at 50% 38%, #000 0%, transparent 80%);
  }
  .top{position:absolute;top:60px;left:64px;right:64px;z-index:4;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:16px;}
  .logo{width:66px;height:66px;border-radius:17px;object-fit:cover;box-shadow:0 8px 24px rgba(59,130,246,0.45), 0 0 0 1px rgba(255,255,255,0.12);}
  .word{font-size:32px;font-weight:800;letter-spacing:-0.02em;}
  .word .g{background:var(--grad-soft);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .counter{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:99px;background:var(--surface);border:1px solid var(--hair);font-size:22px;font-weight:700;color:#cbd5e1;}
  .counter b{color:var(--white);}
  .counter .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);}

  .body{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;padding:150px 72px 210px;}
  .meta{display:flex;align-items:center;gap:20px;margin-bottom:40px;}
  .pill{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border-radius:99px;background:var(--surface);border:1px solid var(--hair);font-size:26px;font-weight:700;color:#e2e8f0;}
  .pill .ic{font-size:28px;line-height:1;}
  .date{font-size:26px;font-weight:600;color:var(--slate-400);}
  .eyebrow{font-size:24px;font-weight:800;letter-spacing:0.24em;text-transform:uppercase;color:var(--blue-bright);margin-bottom:28px;}
  h1{font-size:74px;font-weight:800;line-height:1.08;letter-spacing:-0.035em;max-width:900px;text-wrap:balance;}
  h1 .g{background:var(--grad-soft);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .hero-word{
    margin-top:46px;display:inline-flex;align-items:center;gap:26px;align-self:flex-start;
    padding:26px 36px 26px 28px;border-radius:24px;background:var(--surface);border:1px solid var(--hair-bright);
    box-shadow:0 24px 56px -22px rgba(59,130,246,0.55);
  }
  .hero-word .badge{width:70px;height:70px;border-radius:17px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:36px;box-shadow:0 8px 22px rgba(139,92,246,0.45);}
  .hw-en{font-size:46px;font-weight:800;letter-spacing:-0.01em;color:#fff;line-height:1.05;}
  .hw-bn{font-family:var(--bn);font-size:28px;font-weight:600;color:var(--blue-bright);margin-top:4px;}
  .swipe{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:16px;padding:38px;background:var(--grad);}
  .swipe .txt{font-size:33px;font-weight:800;color:#fff;white-space:nowrap;}
  .swipe .arrow{font-size:35px;font-weight:800;color:#fff;}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img class="logo" src="{{LOGO_SRC}}" alt="StoryVocabs">
      <span class="word">Story<span class="g">Vocabs</span></span>
    </div>
    <div class="counter"><span class="dot"></span><b>{{SLIDE_NUMBER}}</b> / {{TOTAL_SLIDES}}</div>
  </div>

  <div class="body" id="fitBox">
    <div class="meta">
      <span class="pill"><span class="ic">{{CATEGORY_ICON}}</span>{{CATEGORY}}</span>
      <span class="date">{{DATE}}</span>
    </div>
    <div class="eyebrow">Today's Story</div>
    <h1 id="headline">{{HEADLINE_HTML}}</h1>
    <div class="hero-word">
      <span class="badge">⚡</span>
      <span>
        <div class="hw-en">{{HERO_WORD}}</div>
        <div class="hw-bn">{{HERO_BN}}</div>
      </span>
    </div>
  </div>

  <div class="swipe">
    <span class="txt">Swipe to learn {{SWIPE_COUNT}} new words</span>
    <span class="arrow">→</span>
  </div>

<script>
  // Auto-fit: shrink the headline if it would overflow the body box.
  (function(){
    function fit(){
      var box = document.getElementById('fitBox');
      var h1  = document.getElementById('headline');
      var size = 74, min = 40;
      while (box.scrollHeight > box.clientHeight && size > min){
        size -= 2; h1.style.fontSize = size + 'px';
      }
      window.__fitDone = true;
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    else window.addEventListener('load', fit);
  })();
</script>
</body>
</html>
