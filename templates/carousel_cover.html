<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
    background: #f8fafc;
    background-image:
      radial-gradient(at 0% 0%, rgba(147, 197, 253, 0.45) 0px, transparent 50%),
      radial-gradient(at 100% 0%, rgba(196, 181, 253, 0.45) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(253, 164, 175, 0.25) 0px, transparent 50%),
      radial-gradient(at 0% 100%, rgba(167, 243, 208, 0.25) 0px, transparent 50%);
    overflow: hidden; position: relative;
  }
  .content {
    position: relative; z-index: 10;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 120px 70px 100px; gap: 30px; text-align: center;
  }
  .brand-top {
    position: absolute; top: 35px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px;
    padding: 14px 32px; border-radius: 60px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow: 0 8px 32px rgba(0,0,0,0.06);
  }
  .logo-img {
    width: 72px; height: 72px; border-radius: 16px;
    box-shadow: 0 8px 32px rgba(59,130,246,0.3);
  }
  .logo-text {
    font-size: 32px; font-weight: 900;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    letter-spacing: -0.01em;
  }
  .category-pill {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 14px 32px; border-radius: 99px;
    background: rgba(139,92,246,0.07);
    border: 1px solid rgba(139,92,246,0.15);
    font-size: 22px; font-weight: 700; color: #7c3aed;
  }
  .main-title {
    font-size: 64px; font-weight: 900; color: #111827;
    line-height: 1.1; letter-spacing: -0.03em;
    max-width: 940px;
  }
  .main-title .grad {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .divider {
    width: 100px; height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
  }
  .subtitle {
    font-size: 30px; color: #6b7280; font-weight: 600;
    line-height: 1.5;
  }
  .word-count-badge {
    display: inline-flex; align-items: center; gap: 16px;
    padding: 22px 48px; border-radius: 28px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(59,130,246,0.12);
    box-shadow: 0 8px 32px rgba(0,0,0,0.04);
    font-size: 24px; font-weight: 700; color: #374151;
  }
  .word-count-badge .num {
    font-size: 48px; font-weight: 900;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .app-cta {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 26px 24px;
    background: linear-gradient(135deg, rgba(59,130,246,0.92), rgba(139,92,246,0.92));
    backdrop-filter: blur(10px);
    z-index: 20;
  }
  .cta-icon { font-size: 22px; }
  .cta-text {
    font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.95);
  }
  .cta-url {
    font-size: 22px; font-weight: 900; color: white;
    letter-spacing: 0.02em;
  }
  .post-badge {
    position: absolute; top: 38px; right: 40px;
    padding: 10px 22px; border-radius: 12px;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(0,0,0,0.06);
    font-size: 16px; font-weight: 700; color: #6b7280;
    z-index: 15;
  }
</style>
</head>
<body>
  <div class="brand-top">
    <img class="logo-img" src="{{LOGO_SRC}}" alt="StoryVocabs" />
    <span class="logo-text">StoryVocabs</span>
  </div>
  
  <div class="post-badge">{{POST_LABEL}}</div>
  
  <div class="content">
    <div class="category-pill">{{CATEGORY_ICON}} {{CATEGORY}}</div>
    <div class="main-title">{{TITLE}}</div>
    <div class="divider"></div>
    <div class="subtitle">খবর পড়ো, শব্দ শেখো, পরীক্ষায় জেতো</div>
    <div class="word-count-badge">
      <span class="num">{{WORD_COUNT}}</span>
      <span>টি শব্দ শেখো</span>
    </div>
  </div>
  
  <div class="app-cta">
    <span class="cta-icon">📖</span>
    <span class="cta-text">গল্পে শব্দ শিখতে এখনই ডাউনলোড করো</span>
    <span class="cta-url">storyvocabs.vercel.app</span>
  </div>
</body>
</html>
