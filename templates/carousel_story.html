<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
    background: #f8fafc;
    background-image:
      radial-gradient(at 0% 0%, rgba(147, 197, 253, 0.4) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(196, 181, 253, 0.3) 0px, transparent 50%);
    display: flex; align-items: center; justify-content: center;
    padding: 50px;
  }
  .card {
    width: 980px; padding: 60px 50px;
    background: linear-gradient(135deg, rgba(255,255,255,0.88), rgba(255,255,255,0.5));
    backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 36px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.9);
    display: flex; flex-direction: column; gap: 28px;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
  }
  .slide-num {
    font-size: 16px; font-weight: 800; color: #3b82f6;
    background: rgba(59,130,246,0.08); padding: 8px 20px;
    border-radius: 12px;
  }
  .category-tag {
    font-size: 14px; font-weight: 700; color: #7c3aed;
    background: rgba(139,92,246,0.08); padding: 8px 20px;
    border-radius: 12px;
  }
  .story-text {
    font-size: 28px; line-height: 1.8; color: #1f2937;
    flex: 1; display: flex; align-items: center;
  }
  .story-text .highlight {
    color: #3b82f6; font-weight: 800;
    text-decoration: underline;
    text-decoration-color: rgba(59,130,246,0.3);
    text-underline-offset: 4px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px;
  }
  .logo {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .page-indicator {
    font-size: 14px; color: #9ca3af; font-weight: 600;
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="slide-num">{{SLIDE_NUM}}/5</div>
    <div class="category-tag">{{CATEGORY}}</div>
  </div>
  <div class="story-text">{{STORY_TEXT}}</div>
  <div class="footer">
    <div class="logo">StoryVocabs 📖</div>
    <div class="page-indicator">{{PAGE_HINT}}</div>
  </div>
</div>
</body>
</html>
