<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 80px 60px; gap: 40px;
  }
  .word-card {
    width: 100%; padding: 40px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .word-num {
    font-size: 16px; font-weight: 800; color: #3b82f6;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .word {
    font-size: 48px; font-weight: 900; color: white;
  }
  .pronunciation {
    font-size: 22px; color: #94a3b8; font-weight: 500;
    font-style: italic;
  }
  .meaning {
    font-size: 26px; color: #60a5fa; font-weight: 700;
  }
  .example {
    font-size: 20px; color: #94a3b8; font-weight: 500;
    line-height: 1.6; font-style: italic;
  }
  .branding {
    margin-top: auto; text-align: center;
  }
  .branding .logo {
    font-size: 28px; font-weight: 900;
    background: linear-gradient(135deg, #3b82f6, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .branding .tagline {
    font-size: 18px; color: #64748b; font-weight: 500;
    margin-top: 8px;
  }
  .follow-cta {
    font-size: 20px; font-weight: 800; color: white;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    padding: 18px 48px; border-radius: 16px;
  }
</style>
</head>
<body>
{{WORD_CARDS}}
<div class="branding">
  <div class="logo">StoryVocabs 📖</div>
  <div class="tagline">খবর পড়ো, শব্দ শেখো, পরীক্ষায় জেতো</div>
</div>
<div class="follow-cta">@storyvocabs ফলো করো →</div>
</body>
</html>
