.cards{position:absolute;inset:0;display:flex;flex-direction:column;gap:24px}

.wcard .w{font-family:var(--en-display);font-size:92px;line-height:1;color:var(--ink)}

.wcard .mb{font-family:var(--bn);font-size:31px;line-height:1.45;color:var(--ink-2)}
.wcard .ex{margin-top:auto;font-size:29px;line-height:1.45;color:var(--ink);padding:18px 22px;background:var(--surface-2);border-radius:16px}
