<!doctype html><html><head><meta charset="utf-8"><style>{{FONT_CSS}}{{BASE_CSS}}
.k{font-family:var(--bn);font-weight:600;font-size:28px;color:var(--ink-2)}
.wbox{margin-top:18px;height:140px}
.word{font-family:var(--en-display);font-size:128px;line-height:1;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.ph{font-family:var(--en);font-size:28px;color:var(--muted);margin-top:4px}
.q{margin-top:34px;font-family:var(--bn);font-weight:700;font-size:46px;line-height:1.35;color:var(--ink)}
.opts{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{display:flex;align-items:center;gap:18px;min-height:118px;padding:18px 24px;background:var(--surface);border:2px solid var(--line);border-radius:22px;font-family:var(--bn);font-weight:500;font-size:32px;line-height:1.3;color:var(--ink)}
.opt .l{flex:none;width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:700;font-size:28px}
.hint{margin-top:24px;padding:24px 32px;background:var(--tint);border:2px solid var(--tint-2);border-radius:22px;display:{{HINT_DISPLAY}}}
.hint .l{color:var(--accent-deep);margin-bottom:6px}
.hint .s{font-family:var(--en);font-size:30px;line-height:1.45;color:var(--ink-2)}
.hint .s b{background:linear-gradient(180deg, transparent 58%, var(--marker) 58%);padding:0 5px;border-radius:4px;color:var(--ink)}
.note{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:20px}
.note .a{font-family:var(--bn);font-weight:600;font-size:32px;line-height:1.35;color:var(--ink)}
.note .a b{color:var(--accent)}
.note .e{flex:none;font-family:var(--en);font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:right}
</style></head><body><div class="canvas">{{HEADER}}
<div class="body">
  <div class="k">{{QUIZ_KICKER}}</div>
  <div class="wbox"><div class="word fit" data-min="64">{{WORD}}</div></div>
  <div class="ph" style="display:{{PH_DISPLAY}}">{{PHONETIC}} · {{POS}}</div>
  <div class="q">{{QUESTION}}</div>
  <div class="opts">{{OPTIONS}}</div>
  <div class="hint"><div class="label l">সূত্র</div><div class="s">{{HINT}}</div></div>
  <div class="note card"><div class="a">{{QUIZ_NOTE}}</div><div class="e">{{EXAM}}</div></div>
</div>
{{FOOTER}}</div>{{FIT_JS}}</body></html>
